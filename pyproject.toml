[project]
name = "ha-mygrid-voltbridge"
version = "0.1.0"
description = "Local MyGrid VoltBridge P1 meter integration for Home Assistant"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "mygrid-voltbridge==0.4.0",
  "pytest-homeassistant-custom-component==0.13.373",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live' --strict-markers --cov=custom_components.mygrid_voltbridge --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
filterwarnings = ["error"]
markers = ["live: runs the real integration against a real device (set VOLTBRIDGE_HOST); excluded from ordinary runs"]

[tool.coverage.run]
branch = true
source = ["custom_components.mygrid_voltbridge"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # typing.Any is used for config-entry plumbing
  "COM812",  # incompatible with the formatter
  "CPY001",
  "D203",
  "D213",
  "E501",
  "ISC001",  # incompatible with the formatter
  "TC001",
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
# The offline suite is not annotated or documented line by line.
"tests/**" = [
  "ANN",
  "ARG",
  "D",
  "INP001",
  "PLC0415",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PT011",
  "S101",
  "SLF001",
]
"scripts/**" = ["INP001", "S101", "T201"]
"conftest.py" = ["D", "INP001"]
# Home Assistant fixes the signatures of platform setup, flow steps and options.
"custom_components/**" = ["ARG"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = ["custom_components/mygrid_voltbridge"]
