# Engineering checklist, not an official HA rating. Comments identify evidence.
# The VoltBridge (HTTP + UDP) integration.
rules:
  action-setup:
    status: exempt
    comment: Uses a standard button entity for reboot; registers no custom services.
  appropriate-polling:
    status: done
    comment: Live values arrive by UDP push, with a once-a-second /api/power fallback while it is silent; the HTTP snapshot and telegram are polled every 30 s (5–600 s configurable) because the device is a small microcontroller. tests/test_integration.py.
  brands:
    status: todo
    comment: Add approved manufacturer artwork and submit to HA brands when publishing; no artwork rights were supplied.
  common-modules:
    status: done
    comment: The independent mygrid-voltbridge library owns the API and decoding; common integration modules own the Home Assistant lifecycle.
  config-flow:
    status: done
    comment: UI host setup that reads one real snapshot and the P1 serial. tests/test_config_flow.py.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers success, duplicate, failure, options and reconfiguration paths.
  dependency-transparency:
    status: done
    comment: Developer README and draft user documentation and manifest disclose mygrid-voltbridge==0.4.0, which has public source and CI and is published on PyPI.
  docs-actions:
    status: done
    comment: Developer README and draft user documentation explains the reboot button.
  docs-conditions:
    status: exempt
    comment: No custom automation conditions.
  docs-high-level-description:
    status: done
    comment: Developer README and draft user documentation introduction and protocol scope.
  docs-installation-instructions:
    status: done
    comment: Developer README and draft user documentation provides immediately usable manual installation and post-publication HACS instructions.
  docs-removal-instructions:
    status: done
    comment: Developer README and draft user documentation explains entry removal and uninstalling.
  docs-triggers:
    status: exempt
    comment: No custom automation triggers.
  entity-event-setup:
    status: exempt
    comment: CoordinatorEntity manages subscriptions; entities register no additional event listeners.
  entity-unique-id:
    status: done
    comment: The P1 meter serial plus the entity key. tests/test_config_flow.py.
  has-entity-name:
    status: done
    comment: VoltBridgeEntity sets has_entity_name for all platforms.
  runtime-data:
    status: done
    comment: Typed VoltBridgeConfigEntry stores the coordinator in runtime_data.
  test-before-configure:
    status: done
    comment: The config flow reads one real snapshot, and a P1 serial, before creating an entry.
  test-before-setup:
    status: done
    comment: The first snapshot is read before platforms are forwarded; no data raises ConfigEntryNotReady. tests/test_integration.py.
  unique-config-entry:
    status: done
    comment: Entries are unique per P1 serial, so a new address updates the entry.
  action-exceptions:
    status: done
    comment: Standard entity actions raise translated ServiceValidationError or HomeAssistantError.
  config-entry-unloading:
    status: done
    comment: Platform unload removes listeners and releases the managed unit; other consumers keep their connection. tests/test_integration.py.
  docs-configuration-parameters:
    status: done
    comment: Developer README and draft user documentation documents the host and the polling options.
  docs-installation-parameters:
    status: done
    comment: Developer README and draft user documentation documents host, port and fixed unit ID.
  entity-unavailable:
    status: done
    comment: Entities follow coordinator availability.
  integration-owner:
    status: todo
    comment: Connected account @tjorim is listed in codeowners; confirm ongoing maintainership before publication.
  log-when-unavailable:
    status: done
    comment: Coordinator logs failure and recovery transitions. tests/test_integration.py.
  parallel-updates:
    status: done
    comment: VoltBridge sensors use PARALLEL_UPDATES = 0 and are serialised by the client.
  reauthentication-flow:
    status: exempt
    comment: The device API has no authentication.
  test-coverage:
    status: done
    comment: Tests cover the config flow, first refresh, UDP updates and diagnostics; CI requires at least 95 percent coverage.
  devices:
    status: done
    comment: One device per configured meter; it carries its serial, MAC connection and web page.
  diagnostics:
    status: done
    comment: Diagnostics redact the host and meter serial.
  discovery:
    status: done
    comment: The VoltBridge advertises _mygrid._tcp (zeroconf) and is followed by DHCP for known devices.
  discovery-update-info:
    status: done
    comment: A VoltBridge address change updates the entry host and MAC. tests/test_config_flow.py.
  docs-data-update:
    status: done
    comment: Developer README and draft user documentation documents polling, UDP push and reconnect behavior.
  docs-examples:
    status: done
    comment: Developer README and draft user documentation includes a solar-surplus automation example.
  docs-known-limitations:
    status: done
    comment: Developer README and draft user documentation states the firmware build checked and the unverified fields.
  docs-supported-devices:
    status: done
    comment: The documentation covers the VoltBridge firmware build 15.6 and its unverified export/L2/L3 fields.
  docs-supported-functions:
    status: done
    comment: Developer README and draft user documentation entity table.
  docs-troubleshooting:
    status: done
    comment: Developer README and draft user documentation troubleshooting section and diagnostics.
  docs-use-cases:
    status: done
    comment: Developer README and draft user documentation covers energy monitoring and automation examples.
  dynamic-devices:
    status: exempt
    comment: Each config entry represents exactly one device.
  entity-category:
    status: done
    comment: Breaker, limiter, fuse, peak time, Wi-Fi signal and packet error rate are diagnostics.
  entity-device-class:
    status: done
    comment: Device classes are assigned where Home Assistant defines one.
  entity-disabled-by-default:
    status: done
    comment: Per-phase power and limiter/fuse thresholds are opt-in.
  entity-translations:
    status: done
    comment: All names and enum states have English translation keys and a matching strings.json.
  exception-translations:
    status: done
    comment: Errors raised to users use translated exception messages.
  icon-translations:
    status: done
    comment: Standard device-class icons plus icons.json for tariff and breaker states.
  reconfiguration-flow:
    status: done
    comment: A VoltBridge address change updates the entry host and MAC. tests/test_config_flow.py.
  repair-issues:
    status: done
    comment: A repair issue is raised while a reachable VoltBridge receives no P1 data and clears itself. tests/test_integration.py.
  stale-devices:
    status: exempt
    comment: No dynamic subdevices; entry removal removes the single configured device through HA.
  async-dependency:
    status: done
    comment: The client is fully async and uses the Home Assistant aiohttp session.
  inject-websession:
    status: done
    comment: The VoltBridge client uses the Home Assistant aiohttp session.
  strict-typing:
    status: done
    comment: All integration modules pass strict mypy; CI runs the same check.
