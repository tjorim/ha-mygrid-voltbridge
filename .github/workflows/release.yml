name: Build release asset
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/validate_metadata.py
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("custom_components/mygrid_voltbridge/manifest.json").read_text())
          if os.environ["RELEASE_TAG"] != manifest["version"]:
              raise SystemExit("Release tag must exactly match manifest version")
          PYTHON
      - run: uv run python scripts/build_release.py
      - name: Attach install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
